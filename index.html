<body>
<canvas id="game" tabindex="-1"></canvas>
<div id="ui">
  <div id="boot"><div class="boot-box"><div class="boot-title">STEEL TIDE</div><div class="boot-bar"><i id="boot-fill"></i></div><div id="boot-text">Raising steam</div></div></div>
  <div id="hud" hidden></div>
  <div id="screens"></div>
  <div id="notice" hidden></div>
</div>
<div id="pc-only" hidden>
  <div class="pc-card">
    <div class="pc-mark">STEEL TIDE</div>
    <p>Steel Tide is made for PC. Open hunteracedev.com on a computer to play.</p>
    <a class="btn primary" href="/">Back to HunterAceDev</a>
  </div>
</div>
<noscript><div id="pc-only-ns"><p>Steel Tide needs JavaScript and a PC browser.</p><p><a href="/">Back to HunterAceDev</a></p></div></noscript>
<script>
// PC only: phones and tablets (touch-only devices or small screens) get a message and the 3D engine is never loaded.
(function () {
  var mm = function (q) { return window.matchMedia && window.matchMedia(q).matches; };
  var ua = navigator.userAgent || '';
  var touchOnly = (mm('(pointer: coarse)') && !mm('(any-pointer: fine)')) || (mm('(hover: none)') && !mm('(any-hover: hover)'));
  var mobileUA = /Android|iPhone|iPad|iPod|Mobile|Silk|Kindle|Opera Mini|IEMobile/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var sw = screen.width || 0, sh = screen.height || 0; // some embedded browsers report 0: only trust real sizes
  var small = sw > 0 && sh > 0 && (Math.min(sw, sh) < 600 || Math.max(sw, sh) < 1000);
  if (touchOnly || mobileUA || small) {
    document.getElementById('pc-only').hidden = false; document.getElementById('ui').hidden = true; document.getElementById('game').hidden = true;
    window.__steelTideBlocked = true;
  } else {
    import('./js/main.js').catch(function (e) { console.error(e); document.getElementById('boot-text').textContent = 'Could not start: ' + e.message; });
  }
})();
</script>
